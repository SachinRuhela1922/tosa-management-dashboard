<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tosa - Login</title>

    <style>

        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --background: #070707;
    --card: #111111;
    --border: #252525;
    --text: #ffffff;
    --muted: #8d8d8d;
    --accent: #ffffff;
    --danger: #ff4d4d;
}

body {
    min-height: 100vh;
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #1a1a1a 0%,
            #090909 45%,
            #050505 100%
        );

    color: var(--text);
}

.login-wrapper {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 24px;
}

.login-card {
    width: 100%;
    max-width: 430px;

    background: rgba(17, 17, 17, 0.96);

    border: 1px solid var(--border);
    border-radius: 18px;

    padding: 40px;

    box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.5);

    backdrop-filter: blur(15px);
}

/* Brand */

.brand {
    display: flex;
    align-items: center;
    gap: 12px;

    margin-bottom: 35px;
}

.logo {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: #ffffff;
    color: #000000;

    font-size: 22px;
    font-weight: 800;
}

.brand h1 {
    font-size: 24px;
    font-weight: 700;
}

/* Heading */

.heading {
    margin-bottom: 30px;
}

.heading h2 {
    font-size: 28px;
    margin-bottom: 8px;
}

.heading p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
}

/* Form */

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;

    font-size: 13px;
    font-weight: 600;

    margin-bottom: 8px;
}

input {
    width: 100%;

    height: 50px;

    padding: 0 15px;

    background: #0b0b0b;

    border: 1px solid #292929;
    border-radius: 10px;

    color: #ffffff;

    font-size: 14px;

    outline: none;

    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}

input::placeholder {
    color: #5f5f5f;
}

input:focus {
    border-color: #777777;

    box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.06);
}

/* Password */

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 65px;
}

.password-toggle {
    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    background: none;
    border: none;

    color: #aaaaaa;

    cursor: pointer;

    font-size: 12px;
    font-weight: 600;
}

.password-toggle:hover {
    color: #ffffff;
}

/* Errors */

.error {
    display: block;

    min-height: 16px;

    margin-top: 5px;

    color: var(--danger);

    font-size: 12px;
}

.login-error {
    min-height: 20px;

    margin-bottom: 10px;

    text-align: center;

    color: var(--danger);

    font-size: 13px;
}

/* Button */

.login-button {
    width: 100%;
    height: 50px;

    border: none;
    border-radius: 10px;

    background: #ffffff;
    color: #000000;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.2s,
        opacity 0.2s;
}

.login-button:hover {
    transform: translateY(-1px);
}

.login-button:active {
    transform: translateY(0);
}

.login-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* Loader */

.loader {
    display: inline-block;

    width: 17px;
    height: 17px;

    border: 2px solid #777777;
    border-top-color: #000000;

    border-radius: 50%;

    animation: spin 0.7s linear infinite;

    vertical-align: middle;
}

.hidden {
    display: none;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Security */

.security-note {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 7px;

    margin-top: 25px;

    color: #666666;

    font-size: 12px;
}

/* Mobile */

@media (max-width: 500px) {

    .login-card {
        padding: 28px 22px;
    }

    .heading h2 {
        font-size: 24px;
    }
}
    </style>
</head>

<body>

    <main class="login-wrapper">

        <section class="login-card">

            <div class="brand">
                <div class="logo">T</div>
                <h1>Tosa</h1>
            </div>

            <div class="heading">
                <h2>Welcome back</h2>
                <p>Sign in to access your Tosa dashboard.</p>
            </div>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">Email ID</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >

                    <small class="error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <small class="error" id="passwordError"></small>
                </div>

                <div
                    class="login-error"
                    id="loginError"
                    role="alert"
                ></div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    <span id="buttonText">Login</span>
                    <span id="loader" class="loader hidden"></span>
                </button>

            </form>

            <div class="security-note">
                <span>🔒</span>
                <span>Authorized access only</span>
            </div>

        </section>

    </main>

    <script>
     // ============================================
// TOSA LOCAL AUTHENTICATION
// ============================================

const AUTHORIZED_USERS = [
    {
        email: "io.sachinruhela@gmail.com",
        password: "Madamji"
    },
    {
        email: "shivapal008@gmail.com",
        password: "Madamji"
    },
    {
        email: "rajeevsingh697700@gmail.com",
        password: "Madamji"
    },
    {
        email: "admin4@tosa.dev",
        password: "Tosa@4567"
    }
];


// ============================================
// DOM ELEMENTS
// ============================================

const loginForm = document.getElementById("loginForm");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const emailError = document.getElementById("emailError");
const passwordError = document.getElementById("passwordError");
const loginError = document.getElementById("loginError");

const togglePassword =
    document.getElementById("togglePassword");

const loginButton =
    document.getElementById("loginButton");

const buttonText =
    document.getElementById("buttonText");

const loader =
    document.getElementById("loader");


// ============================================
// CHECK DOM
// ============================================

if (!loginForm) {
    console.error("Tosa: Login form not found.");
}


// ============================================
// SHOW / HIDE PASSWORD
// ============================================

if (togglePassword) {

    togglePassword.addEventListener("click", () => {

        const passwordVisible =
            passwordInput.type === "text";

        if (passwordVisible) {

            passwordInput.type = "password";

            togglePassword.textContent = "Show";

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );

        } else {

            passwordInput.type = "text";

            togglePassword.textContent = "Hide";

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );
        }
    });
}


// ============================================
// LOGIN
// ============================================

loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearErrors();

    const email =
        emailInput.value.trim().toLowerCase();

    const password =
        passwordInput.value;


    // ----------------------------------------
    // VALIDATION
    // ----------------------------------------

    let valid = true;


    if (!email) {

        emailError.textContent =
            "Email is required.";

        valid = false;

    } else if (!isValidEmail(email)) {

        emailError.textContent =
            "Enter a valid email address.";

        valid = false;
    }


    if (!password) {

        passwordError.textContent =
            "Password is required.";

        valid = false;
    }


    if (!valid) {
        return;
    }


    // ----------------------------------------
    // LOADING
    // ----------------------------------------

    setLoading(true);


    // Small delay for better UX
    await delay(600);


    // ----------------------------------------
    // CHECK USER
    // ----------------------------------------

    const authenticatedUser =
        AUTHORIZED_USERS.find((user) => {

            return (
                user.email === email &&
                user.password === password
            );

        });


    // ----------------------------------------
    // INVALID LOGIN
    // ----------------------------------------

    if (!authenticatedUser) {

        loginError.textContent =
            "Invalid email or password.";

        setLoading(false);

        passwordInput.value = "";

        passwordInput.focus();

        return;
    }


    // ----------------------------------------
    // LOGIN SUCCESS
    // ----------------------------------------

    sessionStorage.setItem(
        "tosaAuthenticated",
        "true"
    );

    sessionStorage.setItem(
        "tosaUser",
        authenticatedUser.email
    );


    // ----------------------------------------
    // REDIRECT
    // ----------------------------------------

    window.location.href =
        "dashboard.html";

});


// ============================================
// EMAIL VALIDATION
// ============================================

function isValidEmail(email) {

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    return emailPattern.test(email);
}


// ============================================
// CLEAR ERRORS
// ============================================

function clearErrors() {

    emailError.textContent = "";

    passwordError.textContent = "";

    loginError.textContent = "";
}


// ============================================
// LOADING STATE
// ============================================

function setLoading(isLoading) {

    loginButton.disabled = isLoading;


    if (isLoading) {

        buttonText.classList.add("hidden");

        loader.classList.remove("hidden");

    } else {

        buttonText.classList.remove("hidden");

        loader.classList.add("hidden");
    }
}


// ============================================
// DELAY
// ============================================

function delay(milliseconds) {

    return new Promise((resolve) => {

        setTimeout(resolve, milliseconds);

    });
}
    </script>

</body>
</html>
